<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#020402" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Christmas Tree</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Be Vietnam Pro"', '"Montserrat"', 'system-ui', '-apple-system', 'sans-serif'],
              serif: ['"Playfair Display"', 'Georgia', 'serif'],
              cinzel: ['"Cinzel"', 'serif'],
              vietnam: ['"Be Vietnam Pro"', 'sans-serif'],
              handwriting: ['"Dancing Script"', 'cursive', 'serif'],
            }
          }
        }
      }
    </script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Cinzel:wght@400;700&family=Dancing+Script:wght@600;700&family=Montserrat:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&display=swap');
      
      body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #020402; /* Deepest Green/Black */
        font-family: 'Be Vietnam Pro', system-ui, -apple-system, sans-serif;
      }

      /* Photo overlay animations */
      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      @keyframes scaleIn {
        from {
          transform: scale(0.8);
          opacity: 0;
        }
        to {
          transform: scale(1);
          opacity: 1;
        }
      }

      .animate-fade-in {
        animation: fadeIn 0.3s ease-out;
      }

      .animate-scale-in {
        animation: scaleIn 0.4s ease-out;
      }

      /* Synchronized Luxury Gold Scrollbar */
      .custom-scrollbar::-webkit-scrollbar,
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }

      .custom-scrollbar::-webkit-scrollbar-track,
      ::-webkit-scrollbar-track {
        background: rgba(10, 15, 10, 0.7);
        border-radius: 9999px;
        margin: 4px 0;
      }

      .custom-scrollbar::-webkit-scrollbar-thumb,
      ::-webkit-scrollbar-thumb {
        background: linear-gradient(180deg, #D4AF37 0%, #A37B1B 100%);
        border-radius: 9999px;
        border: 1px solid rgba(245, 230, 191, 0.35);
        box-shadow: 0 0 6px rgba(212, 175, 55, 0.3);
      }

      .custom-scrollbar::-webkit-scrollbar-thumb:hover,
      ::-webkit-scrollbar-thumb:hover {
        background: linear-gradient(180deg, #F5E6BF 0%, #D4AF37 100%);
        box-shadow: 0 0 10px rgba(212, 175, 55, 0.6);
      }

      .custom-scrollbar,
      * {
        scrollbar-width: thin;
        scrollbar-color: #D4AF37 rgba(10, 15, 10, 0.7);
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "@react-three/fiber": "https://aistudiocdn.com/@react-three/fiber@^9.4.0",
    "three": "https://aistudiocdn.com/three@^0.181.2",
    "@react-three/postprocessing": "https://aistudiocdn.com/@react-three/postprocessing@^3.0.4",
    "@react-three/drei": "https://aistudiocdn.com/@react-three/drei@^10.7.7",
    "postprocessing": "https://aistudiocdn.com/postprocessing@^6.38.0",
    "@mediapipe/tasks-vision": "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/+esm"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>

    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
